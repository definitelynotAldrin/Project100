<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="layout">
        <header>Header</header>
        <main>Main</main>
        <aside>Sidebar</aside>
        <footer>Footer</footer>
    </div>

    <div class="polygon"></div>
</body>
<style>
    body{
            display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 3rem;
    }

    .layout {
  display: grid;
  grid-template-columns: 1fr 3fr;
  grid-template-areas:
    "header header"
    "aside  main"
    "footer footer";
}

header{
    background-color: red;
    padding: 2rem;
}

main{
    background-color: blue;
     padding: 2rem;
}

aside{
    background-color: yellowgreen;
     padding: 2rem;
}

footer{
    background-color: aqua;
     padding: 2rem;
}

header { grid-area: header; }
main   { grid-area: main; }
aside  { grid-area: aside; }
footer { grid-area: footer; }


@media (max-width: 768px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main"
      "aside"
      "footer";
  }
}

.polygon{
    width: 500px;
    height: 500px;
    background-color: red;
        clip-path: polygon(
    0 0,
    100% 0%,
    100% 85%,
    50% 100%,
    0 85%
  );
}

</style>
</html>
